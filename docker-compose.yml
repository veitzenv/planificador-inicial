services:
  db:
    image: postgres:18
    container_name: planificador-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - "planificador-data:/var/lib/postgresql"

volumes:
  planificador-data:
